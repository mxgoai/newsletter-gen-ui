<header
  class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4 px-4 sm:px-6 lg:px-8 py-4 sm:py-6 mb-6 lg:mb-10"
>
  <div class="flex flex-wrap sm:flex-nowrap items-center">
    <img
      src="/knowsletter-logo.svg"
      alt="KnowsLetter logo"
      class="h-8 w-8 sm:h-12 sm:w-12"
    />
    <h1 class="text-lg sm:text-2xl font-extrabold tracking-tighter">
      <span class="text-black">KNOWS</span
      ><span class="text-[#447abc]">LETTER</span>
    </h1>
    <div class="h-4 w-[1px] bg-gray-200 hidden sm:block sm:mx-4 mx-2"></div>
    <span
      class="w-full sm:w-auto text-[11px] sm:text-xs font-semibold text-gray-500 border border-gray-100 px-2 sm:px-3 py-1 rounded-full bg-gray-50/50 sm:text-left text-center sm:mt-0 mt-4"
      >Personalised Newsletters for free</span
    >
  </div>
  <div class="flex items-center gap-3 w-full sm:w-auto justify-end absolute top-4 sm:top-6 right-4 sm:right-6 lg:right-8">
    <div id="user-info" class="hidden relative">
      <button
        type="button"
        id="profile-btn"
        class="w-9 h-9 sm:w-10 sm:h-10 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:text-gray-900 hover:border-gray-300 transition"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <span
          class="material-symbols-outlined text-[18px] sm:text-[20px]"
          >person</span
        >
      </button>
      <div
        id="profile-menu"
        class="hidden absolute right-0 mt-3 w-52 sm:w-56 max-w-[calc(100vw-2rem)] rounded-2xl border border-gray-100 bg-white shadow-xl p-2.5 sm:p-3 z-30"
      >
        <p
          id="user-email"
          class="text-[10px] sm:text-[11px] font-semibold text-gray-600 px-2 py-2 break-all"
        ></p>
        <button
          type="button"
          id="logout-btn"
          class="w-full mt-1 rounded-xl border border-gray-200 px-3 py-2 text-[10px] sm:text-[11px] font-bold text-gray-600 hover:text-gray-900 hover:border-gray-300 transition"
        >
          Logout
        </button>
      </div>
    </div>
  </div>
</header>
